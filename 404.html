<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Finance Dashboard</title>
    <link rel="stylesheet" href="/Homepage/Homepage.css">
    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .error-code {
            font-size: 120px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 24px;
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        
        .navigation-links {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        .nav-link {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .nav-link:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-message">Oops! The page you're looking for doesn't exist.</h1>
        <div class="navigation-links">
            <a href="/" class="nav-link">Return Home</a>
            <a href="/Dashboard" class="nav-link">Go to Dashboard</a>
        </div>
        <p style="margin-top: 30px; color: #95a5a6;">
            If you believe this is an error, please contact support.
        </p>
    </div>
</body>
</html>
